<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>To My Beloved ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw; height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            background: radial-gradient(circle at center, #2e1d2a 0%, #1f141d 50%, #120b10 100%);
            font-family: 'Cairo', sans-serif;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            position: fixed; padding: 25px 20px;
            transition: opacity 1.5s ease-in-out;
        }
        .fade-out { opacity: 0 !important; }

        .romantic-decorations {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; overflow: hidden;
        }
        .rom-item {
            position: absolute; font-size: 22px; opacity: 0.4;
            animation: floatRom 6s ease-in-out infinite alternate;
        }
        .rom-1 { top: 12%; left: 10%; }
        .rom-2 { top: 18%; right: 12%; animation-delay: 1.5s; font-size: 25px; }
        .rom-3 { bottom: 15%; left: 12%; animation-delay: 3s; font-size: 24px; }
        .rom-4 { bottom: 12%; right: 15%; animation-delay: 4.5s; }
        @keyframes floatRom {
            0% { transform: translateY(0px) scale(0.95); opacity: 0.25; }
            100% { transform: translateY(-12px) scale(1.05); opacity: 0.55; }
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .top-header-title {
            position: absolute; top: 35px; z-index: 10;
            font-family: 'Cinzel', serif; font-size: clamp(1.3rem, 4vw, 1.7rem);
            color: #ffb6c1; letter-spacing: 4px; font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
            opacity: 0; animation: fadeInHeader 1.5s ease forwards 0.5s;
        }
        @keyframes fadeInHeader { to { opacity: 1; } }

        .content-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 25px; width: 100%; max-width: 600px; margin: auto;
            z-index: 10;
        }

        .romantic-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1.2rem, 3.2vw, 1.8rem);
            color: #ffb6c1;
            line-height: 1.6;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        .password-container {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            width: 100%; max-width: 320px; opacity: 0; transform: translateY(20px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
        }
        .password-container.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .password-input {
            width: 100%; padding: 13px 20px; background: rgba(40, 25, 36, 0.9);
            border: 2px solid rgba(255, 182, 193, 0.4); border-radius: 50px;
            color: #fff1f2; font-size: 1.1rem; text-align: center; outline: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); transition: all 0.3s ease;
            font-family: 'Cinzel', serif; letter-spacing: 3px;
        }
        .password-input:focus { border-color: #ffb6c1; box-shadow: 0 0 20px rgba(255, 182, 193, 0.6); }

        .surprise-btn-wrapper {
            position: relative; padding: 2.5px; border-radius: 26px; overflow: hidden;
            width: 100%; cursor: pointer; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }
        .surprise-btn-wrapper:active { transform: scale(0.97); }
        .surprise-btn-wrapper::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 182, 193, 0.5), #ff758c, #ff7eb3, transparent 65%);
            animation: rotateGlow 4.5s linear infinite;
        }
        @keyframes rotateGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .surprise-btn-content {
            position: relative; background: rgba(40, 25, 36, 0.95); backdrop-filter: blur(20px);
            padding: 15px 20px; border-radius: 24px; z-index: 2; text-align: center;
        }
        .surprise-btn-content span {
            font-family: 'Cinzel', serif; font-size: clamp(0.95rem, 3.2vw, 1.1rem);
            color: #fff1f2; font-weight: 700; letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 182, 193, 0.5);
        }

        .error-msg { color: #ff6b81; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s ease; }
        .error-msg.show { opacity: 1; }

        .bottom-signature {
            font-family: 'Cinzel', serif; font-size: clamp(0.95rem, 3vw, 1.15rem);
            color: #ffd700; letter-spacing: 3px; font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); z-index: 10;
            padding-bottom: 10px; animation: pulseSignature 3s ease-in-out infinite alternate;
        }
        @keyframes pulseSignature { 0% { transform: scale(1); opacity: 0.85; } 100% { transform: scale(1.03); opacity: 1; } }

        .section-surprise {
            display: none; width: 100%; height: 100%; flex-direction: column;
            justify-content: flex-start; align-items: center; position: absolute;
            top: 0; left: 0; padding: 20px 15px; opacity: 0; transition: opacity 1s ease-in-out; z-index: 10;
        }
        .section-surprise.active { display: flex; opacity: 1; }

        .counter-box {
            background: rgba(40, 25, 36, 0.85); backdrop-filter: blur(15px);
            border: 1.5px solid rgba(255, 182, 193, 0.3); border-radius: 20px;
            padding: 12px 15px; width: 100%; max-width: 500px; display: flex;
            justify-content: space-around; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 15px; flex-shrink: 0;
        }
        .time-unit { display: flex; flex-direction: column; align-items: center; }
        .time-value {
            font-family: 'Cinzel', serif; font-size: clamp(1.1rem, 4vw, 1.4rem);
            color: #ffd700; font-weight: 700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .time-label { font-size: clamp(0.7rem, 2.5vw, 0.85rem); color: #ffb6c1; margin-top: 2px; }
        .time-separator { font-size: 1.2rem; color: rgba(255, 182, 193, 0.5); font-weight: bold; }

        .messages-scroll-container {
            width: 100%; max-width: 550px; flex-grow: 1; overflow-y: auto;
            display: flex; flex-direction: column; gap: 18px; padding: 10px 5px 30px 5px; scroll-behavior: smooth;
        }
        .messages-scroll-container::-webkit-scrollbar { width: 4px; }
        .messages-scroll-container::-webkit-scrollbar-thumb { background: rgba(255, 182, 193, 0.3); border-radius: 10px; }

        .love-card {
            position: relative;
            background: rgba(35, 20, 31, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 18px 22px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            display: none;
            overflow: hidden;
            z-index: 1;
        }
        .love-card.active-card { display: block; }

        .love-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 0%, rgba(255, 182, 193, 0.15) 30%, #ff758c 50%, rgba(255, 182, 193, 0.15) 70%, transparent 100%);
            animation: cardGlowRotate 6s linear infinite;
            z-index: -2;
        }
        .love-card::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: rgba(35, 20, 31, 0.95);
            border-radius: 16px;
            z-index: -1;
        }
        @keyframes cardGlowRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .love-card p {
            font-family: 'Cairo', sans-serif;
            font-size: clamp(1rem, 3.2vw, 1.2rem);
            color: #ffe6eb;
            line-height: 1.8;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.4);
        }

        .section {
            display: none; width: 100%; height: 100%; flex-direction: column;
            justify-content: space-between; align-items: center; position: absolute;
            top: 0; left: 0; padding: 25px 20px; opacity: 0; transition: opacity 1s ease-in-out;
        }
        .section.active { display: flex; opacity: 1; }
    </style>
</head>
<body>

    <audio id="bgMusic" preload="auto" loop>
        <source src="https://serv100.albumaty.com/2025/Albumaty.Com_mnwaat_mwsyki_rwmansyt_mnwaat.mp3" type="audio/mpeg">
    </audio>

    <div class="romantic-decorations">
        <div class="rom-item rom-1">🌹</div>
        <div class="rom-item rom-2">💖</div>
        <div class="rom-item rom-3">✨</div>
        <div class="rom-item rom-4">🌸</div>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <!-- الصفحة الأولى -->
    <div id="section1" class="section active">
        <div class="top-header-title">My Love 💓</div>
        <div></div>
        <div class="content-box">
            <div class="romantic-text" id="typedText1"></div>
        </div>
        <div class="bottom-signature">My Love My Heart My All ❤️❤️</div>
    </div>

    <!-- الصفحة التانية -->
    <div id="section2" class="section">
        <div></div>
        <div class="content-box">
            <div class="romantic-text" id="typedText2"></div>

            <div class="password-container" id="passwordContainer">
                <input type="password" id="passInput" class="password-input" placeholder="Enter Password..." autocomplete="off">
                
                <div class="surprise-btn-wrapper" id="submitBtn">
                    <div class="surprise-btn-content">
                        <span>Let's get to the surprise! ✨</span>
                    </div>
                </div>

                <div id="errorText" class="error-msg">كلمة المرور غير صحيحة، جربي تاني يا قلبي ❤️</div>
            </div>
        </div>
        <div class="bottom-signature">My Love My Heart My All ❤️❤️</div>
    </div>

    <!-- الصفحة التالتة والمفاجأة -->
    <div id="section3" class="section-surprise">
        <div class="top-header-title" style="position: relative; top: 0; margin-bottom: 10px;">Our Eternal Story 💍</div>
        
        <div class="counter-box">
            <div class="time-unit">
                <span class="time-value" id="daysCount">00</span>
                <span class="time-label">أيام</span>
            </div>
            <div class="time-separator">:</div>
            <div class="time-unit">
                <span class="time-value" id="hoursCount">00</span>
                <span class="time-label">ساعات</span>
            </div>
            <div class="time-separator">:</div>
            <div class="time-unit">
                <span class="time-value" id="minsCount">00</span>
                <span class="time-label">دقائق</span>
            </div>
            <div class="time-separator">:</div>
            <div class="time-unit">
                <span class="time-value" id="secsCount">00</span>
                <span class="time-label">ثواني</span>
            </div>
        </div>

        <div class="messages-scroll-container" id="messagesContainer">
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        music.volume = 0.5;
        
        function playAudio() {
            music.play().catch(() => {});
        }

        window.addEventListener('DOMContentLoaded', () => {
            playAudio();
            document.body.addEventListener('click', playAudio, { once: true });
            startFirstScene();
        });

        function switchSection(fromId, toId, callback) {
            const current = document.getElementById(fromId);
            const next = document.getElementById(toId);
            
            current.classList.add('fade-out');
            setTimeout(() => {
                current.classList.remove('active', 'fade-out');
                next.classList.add('active');
                if (callback) callback();
            }, 1000);
        }

        // نص الصفحة الأولى
        const text1 = "To my beloved, the light of my eyes, and the beat of my heart ❤️";
        let i1 = 0;

        function startFirstScene() {
            if (i1 < text1.length) {
                document.getElementById('typedText1').innerHTML += text1.charAt(i1);
                i1++;
                setTimeout(startFirstScene, 65);
            } else {
                setTimeout(() => {
                    switchSection('section1', 'section2', startSecondScene);
                }, 2000);
            }
        }

        // نص الصفحة التانية
        const text2 = "I love you, as it was, in every story that brought us together I love the love that brought us together I love you forever ✨";
        let i2 = 0;

        function startSecondScene() {
            function typeWriter2() {
                if (i2 < text2.length) {
                    document.getElementById('typedText2').innerHTML += text2.charAt(i2);
                    i2++;
                    setTimeout(typeWriter2, 55);
                } else {
                    setTimeout(() => {
                        document.getElementById('passwordContainer').classList.add('show');
                    }, 500);
                }
            }
            typeWriter2();
        }

        const passInput = document.getElementById('passInput');
        const submitBtn = document.getElementById('submitBtn');
        const errorText = document.getElementById('errorText');

        function checkPassword() {
            if (passInput.value === "1532024") {
                passInput.style.borderColor = "#2ecc71";
                passInput.style.boxShadow = "0 0 25px rgba(46, 204, 113, 0.7)";
                errorText.classList.remove('show');
                
                setTimeout(() => {
                    document.body.classList.add('fade-out');
                    setTimeout(() => {
                        document.body.classList.remove('fade-out');
                        switchSection('section2', 'section3', startSurpriseScene);
                    }, 1000);
                }, 500);
            } else {
                errorText.classList.add('show');
                passInput.style.borderColor = "#ff6b81";
                passInput.style.boxShadow = "0 0 20px rgba(255, 107, 129, 0.6)";
                setTimeout(() => {
                    passInput.style.borderColor = "rgba(255, 182, 193, 0.4)";
                    passInput.style.boxShadow = "0 10px 25px rgba(0, 0, 0, 0.4)";
                }, 1000);
            }
        }

        submitBtn.addEventListener('click', checkPassword);
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        function startSurpriseScene() {
            const startDate = new Date(2024, 8, 15, 0, 0, 0); // 15 سبتمبر 2024
            
            function updateTimer() {
                const now = new Date();
                let diff = now - startDate;
                if (diff < 0) diff = 0;
                
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById('daysCount').innerText = String(days).padStart(2, '0');
                document.getElementById('hoursCount').innerText = String(hours).padStart(2, '0');
                document.getElementById('minsCount').innerText = String(minutes).padStart(2, '0');
                document.getElementById('secsCount').innerText = String(seconds).padStart(2, '0');
            }
            setInterval(updateTimer, 1000);
            updateTimer();

            // رسايل الكروت بالترتيب الجديد المطلوب
            const messages = [
                "I Love Yooooooou ❤️ 😍",
                "لحبيبتي ونور عيني 🥺❤️",
                "بحبك قد كل لحظه بينا وقد كل لحظه عشناها مع بعض ❤️🫂",
                "بحبك قد كل حكايه جمعتنا وكل رساله بعتناها لبعض ❤️🫂",
                "اللي انا عامله ده عامله من كل قلبي قبل ما ادخل مرحله من اهم المراحل في حياتي وانتي جمبي ومعايا وداعم اساسي ليا ❤️🫂",
                "احب اقولك انا عمري ما حبيت ولا هحب قدك ينور عيني ❤️🫂",
                "ولو لفيت الدنيا كلها عمري ما الاقي زيك يروحي ❤️🫂",
                "عدينا كتير مع بعض وبنعدي ولسه هنعدي ❤️🫂",
                "ربنا يخليكي ليا وما يحرمني من وجودك لحظه ولا يحرمك من وجودي ❤️🫂",
                "وتفضل ابتسامتك وضحكتك القمر منوره حياتي كل يوم ❤️🫂",
                "ربنا يخلينا لبعض وميفرقش بينا ابدا يحبيبتي ❤️🫂",
                "في اللحظه الحلوه دي عايزك تعرفي اني عمري ما استغني عنك او اني اسيبك لوحدك ولو للحظه ❤️",
                "لو اتطلب مني اقف قدام العالم كله علشان خاطر عيونك هقف وانا رافع راسي ❤️❤️❤️"
            ];

            // إعادة إنشاء عناصر الكروت ديناميكياً لتتناسب مع عدد الرسائل الجديد (13 كارت)
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            messages.forEach(() => {
                const card = document.createElement('div');
                card.className = 'love-card';
                card.innerHTML = '<p class="card-text"></p>';
                container.appendChild(card);
            });

            const cards = document.querySelectorAll('.love-card');
            const textElements = document.querySelectorAll('.card-text');
            let currentMessageIndex = 0;

            function typeMessage() {
                if (currentMessageIndex < messages.length) {
                    const card = cards[currentMessageIndex];
                    const textEl = textElements[currentMessageIndex];
                    card.classList.add('active-card');
                    
                    let charIndex = 0;
                    const currentText = messages[currentMessageIndex];
                    
                    function typeChar() {
                        if (charIndex < currentText.length) {
                            textEl.textContent += currentText.charAt(charIndex);
                            charIndex++;
                            container.scrollTop = container.scrollHeight;
                            setTimeout(typeChar, 25);
                        } else {
                            currentMessageIndex++;
                            setTimeout(typeMessage, 400);
                        }
                    }
                    typeChar();
                }
            }
            
            setTimeout(typeMessage, 800);
        }

        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        initCanvas();
        window.addEventListener('resize', initCanvas);

        const fireworks = [];
        const particles = [];

        class Firework {
            constructor(x, y, targetX, targetY) {
                this.x = x; this.y = y; this.targetX = targetX; this.targetY = targetY;
                this.coordinates = []; this.angle = Math.atan2(targetY - y, targetX - x);
                this.speed = 4; this.accel = 1.04;
                this.brightness = Math.random() * 20 + 60; this.hue = Math.random() * 20 + 340;
            }
            update(index) {
                this.coordinates.pop(); this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.accel;
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < this.speed) {
                    createParticles(this.targetX, this.targetY, this.hue);
                    fireworks.splice(index, 1);
                } else { this.x += vx; this.y += vy; }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.hue}, 90%, ${this.brightness}%)`;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x; this.y = y; this.coordinates = [];
                for (let i = 0; i < 4; i++) { this.coordinates.push([this.x, this.y]); }
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 8 + 1; this.friction = 0.95; this.gravity = 0.8;
                this.hue = hue; this.brightness = Math.random() * 20 + 60;
                this.alpha = 1; this.decay = Math.random() * 0.02 + 0.015;
            }
            update(index) {
                this.coordinates.pop(); this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
                if (this.alpha <= this.decay) { particles.splice(index, 1); }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 90%, ${this.brightness}%, ${this.alpha})`;
                ctx.stroke();
            }
        }

        function createParticles(x, y, hue) {
            let count = 30;
            while (count--) { particles.push(new Particle(x, y, hue)); }
        }

        let timer = 0;
        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(31, 20, 29, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            let i = fireworks.length;
            while (i--) { fireworks[i].update(i); fireworks.draw(); }
            let j = particles.length;
            while (j--) { particles.update(j); particles.draw(); }
            if (timer++ % 55 === 0) {
                let startX = canvas.width / 2; let startY = canvas.height;
                let targetX = Math.random() * canvas.width * 0.7 + canvas.width * 0.15;
                let targetY = Math.random() * canvas.height * 0.4;
                fireworks.push(new Firework(startX, startY, targetX, targetY));
            }
        }
        animate();
    </script>
</body>
</html>
