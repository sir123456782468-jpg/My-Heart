<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>To My Beloved ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw; height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            background: radial-gradient(circle at center, #2e1d2a 0%, #1f141d 50%, #120b10 100%);
            font-family: 'Cairo', sans-serif;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            position: fixed; padding: 25px 20px;
            transition: opacity 1.5s ease-in-out;
        }
        .fade-out { opacity: 0 !important; }

        /* الديكورات والألعاب النارية */
        .romantic-decorations {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; overflow: hidden;
        }
        .rom-item {
            position: absolute; font-size: 22px; opacity: 0.4;
            animation: floatRom 6s ease-in-out infinite alternate;
        }
        .rom-1 { top: 12%; left: 10%; }
        .rom-2 { top: 18%; right: 12%; animation-delay: 1.5s; font-size: 25px; }
        .rom-3 { bottom: 15%; left: 12%; animation-delay: 3s; font-size: 24px; }
        .rom-4 { bottom: 12%; right: 15%; animation-delay: 4.5s; }
        @keyframes floatRom {
            0% { transform: translateY(0px) scale(0.95); opacity: 0.25; }
            100% { transform: translateY(-12px) scale(1.05); opacity: 0.55; }
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .top-header-title {
            position: absolute; top: 35px; z-index: 10;
            font-family: 'Cinzel', serif; font-size: clamp(1.3rem, 4vw, 1.7rem);
            color: #ffb6c1; letter-spacing: 4px; font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
            opacity: 0; animation: fadeInHeader 1.5s ease forwards 0.5s;
        }
        @keyframes fadeInHeader { to { opacity: 1; } }

        /* المحتوى الرئيسي */
        .content-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 25px; width: 100%; max-width: 600px; margin: auto;
            z-index: 10;
        }

        .romantic-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1.4rem, 3.8vw, 2.2rem);
            color: #ffb6c1;
            line-height: 1.6;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        /* صندوق إدخال الباسورد */
        .password-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .password-container.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .password-input {
            width: 100%;
            padding: 13px 20px;
            background: rgba(40, 25, 36, 0.9);
            border: 2px solid rgba(255, 182, 193, 0.4);
            border-radius: 50px;
            color: #fff1f2;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
        }

        .password-input:focus {
            border-color: #ffb6c1;
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
        }

        .surprise-btn-wrapper {
            position: relative;
            padding: 2.5px;
            border-radius: 26px;
            overflow: hidden;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }

        .surprise-btn-wrapper:active { transform: scale(0.97); }

        .surprise-btn-wrapper::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 182, 193, 0.5), #ff758c, #ff7eb3, transparent 65%);
            animation: rotateGlow 4.5s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .surprise-btn-content {
            position: relative;
            background: rgba(40, 25, 36, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            border-radius: 24px;
            z-index: 2;
            text-align: center;
        }

        .surprise-btn-content span {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.95rem, 3.2vw, 1.1rem);
            color: #fff1f2;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 182, 193, 0.5);
        }

        .error-msg {
            color: #ff6b81;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .error-msg.show { opacity: 1; }

        .bottom-signature {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            color: #ffd700;
            letter-spacing: 3px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            z-index: 10;
            padding-bottom: 10px;
            animation: pulseSignature 3s ease-in-out infinite alternate;
        }

        @keyframes pulseSignature {
            0% { transform: scale(1); opacity: 0.85; }
            100% { transform: scale(1.03); opacity: 1; }
        }

        /* القسم الثالث: العداد والرسائل المتسلسلة مع السكرول التلقائي */
        .section-surprise {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            position: absolute;
            top: 0; left: 0;
            padding: 20px 15px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 10;
        }
        .section-surprise.active {
            display: flex;
            opacity: 1;
        }

        /* تصميم العداد الثابت */
        .counter-box {
            background: rgba(40, 25, 36, 0.85);
            backdrop-filter: blur(15px);
            border: 1.5px solid rgba(255, 182, 193, 0.3);
            border-radius: 20px;
            padding: 12px 15px;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-value {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            color: #ffd700;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .time-label {
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            color: #ffb6c1;
            margin-top: 2px;
        }
        .time-separator {
            font-size: 1.2rem;
            color: rgba(255, 182, 193, 0.5);
            font-weight: bold;
        }

        /* صندوق الرسائل المتحركة (سكرول تلقائي سلس) */
        .messages-scroll-container {
            width: 100%;
            max-width: 550px;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px 5px 30px 5px;
            scroll-behavior: smooth;
        }
        .messages-scroll-container::-webkit-scrollbar {
            width: 4px;
        }
        .messages-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(255, 182, 193, 0.3);
            border-radius: 10px;
        }

        .love-card {
            background: rgba(35, 20, 31, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 182, 193, 0.25);
            border-radius: 18px;
            padding: 16px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: none; /* مخفية مبدئياً حتى يتم كتابتها */
        }
        .love-card.active-card {
            display: block;
        }
        .love-card p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1rem, 3vw, 1.25rem);
            color: #ffccd5;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.4);
        }

        /* نظام إخفاء وإظهار الأقسام بسلاسة */
        .section {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0; left: 0;
            padding: 25px 20px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .section.active {
            display: flex;
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- تشغيل الموسيقى المستمرة بدون انقطاع -->
    <audio id="bgMusic" preload="auto" loop>
        <source src="https://serv100.albumaty.com/2025/Albumaty.Com_mnwaat_mwsyki_rwmansyt_mnwaat.mp3" type="audio/mpeg">
    </audio>

    <div class="romantic-decorations">
        <div class="rom-item rom-1">🌹</div>
        <div class="rom-item rom-2">💖</div>
        <div class="rom-item rom-3">✨</div>
        <div class="rom-item rom-4">🌸</div>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <!-- القسم الأول (الصفحة الأولى) -->
    <div id="section1" class="section active">
        <div class="top-header-title">My Love 💓</div>
        <div></div>
        <div class="content-box">
            <div class="romantic-text" id="typedText1"></div>
        </div>
        <div class="bottom-signature">My Love My Heart My All ❤️❤️</div>
    </div>

    <!-- القسم الثاني (صفحة الباسورد) -->
    <div id="section2" class="section">
        <div></div>
        <div class="content-box">
            <div class="romantic-text" id="typedText2"></div>

            <div class="password-container" id="passwordContainer">
                <input type="password" id="passInput" class="password-input" placeholder="Enter Password..." autocomplete="off">
                
                <div class="surprise-btn-wrapper" id="submitBtn">
                    <div class="surprise-btn-content">
                        <span>Let's get to the surprise! ✨</span>
                    </div>
                </div>

                <div id="errorText" class="error-msg">كلمة المرور غير صحيحة، جربي تاني يا قلبي ❤️</div>
            </div>
        </div>
        <div class="bottom-signature">My Love My Heart My All ❤️❤️</div>
    </div>

    <!-- القسم الثالث (العداد والـ 15 رسالة والسكرول التلقائي) -->
    <div id="section3" class="section-surprise">
        <div class="top-header-title" style="position: relative; top: 0; margin-bottom: 10px;">Our Eternal Story 💍</div>
        
        <!-- العداد الثابت -->
        <div class="counter-box">
            <div class="time-unit">
                <span class="time-value" id="daysCount">00</span>
                <span class="time-label">أيام</span>
            </div>
            <div class="time-separator">:</div>
            <div class="time-unit">
                <span class="time-value" id="hoursCount">00</span>
                <span class="time-label">ساعات</span>
            </div>
            <div class="time-separator">:</div>
            <div class="time-unit">
                <span class="time-value" id="minsCount">00</span>
                <span class="time-label">دقائق</span>
            </div>
            <div class="time-separator">:</div>
            <div class="time-unit">
                <span class="time-value" id="secsCount">00</span>
                <span class="time-label">ثواني</span>
            </div>
        </div>

        <!-- صندوق الرسائل مع السكرول التلقائي -->
        <div class="messages-scroll-container" id="messagesContainer">
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
            <div class="love-card"><p class="card-text"></p></div>
        </div>
    </div>

    <script>
        // إعدادات الموسيقى
        const music = document.getElementById('bgMusic');
        music.volume = 0.5;
        
        function playAudio() {
            music.play().catch(() => {});
        }

        window.addEventListener('DOMContentLoaded', () => {
            playAudio();
            document.body.addEventListener('click', playAudio, { once: true });
            startFirstScene();
        });

        // دالة الانتقال السلس بين الأقسام
        function switchSection(fromId, toId, callback) {
            const current = document.getElementById(fromId);
            const next = document.getElementById(toId);
            
            current.classList.add('fade-out');
            setTimeout(() => {
                current.classList.remove('active', 'fade-out');
                next.classList.add('active');
                if (callback) callback();
            }, 1000);
        }

        // المشهد الأول: كتابة الجملة الأولى ثم الانتقال التلقائي
        const text1 = "To my beloved, the light of my eyes, the beat of my heart, and the soul of my heart...";
        let i1 = 0;

        function startFirstScene() {
            if (i1 < text1.length) {
                document.getElementById('typedText1').innerHTML += text1.charAt(i1);
                i1++;
                setTimeout(startFirstScene, 80);
            } else {
                setTimeout(() => {
                    switchSection('section1', 'section2', startSecondScene);
                }, 1500);
            }
        }

        // المشهد الثاني: كتابة الجملة الثانية وإظهار حقل الباسورد
        const text2 = "I love you as it was in every story that brought us together";
        let i2 = 0;

        function startSecondScene() {
            function typeWriter2() {
                if (i2 < text2.length) {
                    document.getElementById('typedText2').innerHTML += text2.charAt(i2);
                    i2++;
                    setTimeout(typeWriter2, 70);
                } else {
                    setTimeout(() => {
                        document.getElementById('passwordContainer').classList.add('show');
                    }, 400);
                }
            }
            typeWriter2();
        }

        // التحقق من كلمة المرور
        const passInput = document.getElementById('passInput');
        const submitBtn = document.getElementById('submitBtn');
        const errorText = document.getElementById('errorText');

        function checkPassword() {
            if (passInput.value === "1532024") {
                passInput.style.borderColor = "#2ecc71";
                passInput.style.boxShadow = "0 0 25px rgba(46, 204, 113, 0.7)";
                errorText.classList.remove('show');
                
                setTimeout(() => {
                    document.body.classList.add('fade-out');
                    setTimeout(() => {
                        document.body.classList.remove('fade-out');
                        switchSection('section2', 'section3', startSurpriseScene);
                    }, 1000);
                }, 500);
            } else {
                errorText.classList.add('show');
                passInput.style.borderColor = "#ff6b81";
                passInput.style.boxShadow = "0 0 20px rgba(255, 107, 129, 0.6)";
                setTimeout(() => {
                    passInput.style.borderColor = "rgba(255, 182, 193, 0.4)";
                    passInput.style.boxShadow = "0 10px 25px rgba(0, 0, 0, 0.4)";
                }, 1000);
            }
        }

        submitBtn.addEventListener('click', checkPassword);
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        // تشغيل العداد وكتابة الرسائل حرف بحرف
        function startSurpriseScene() {
            // العداد الدقيق (من 15 مارس 2024 - مع تعديل فروق التوقيت لضمان صحة الأيام)
            const startDate = new Date(2024, 2, 15, 0, 0, 0); // الشهر 2 يعني مارس في جافاسكريبت
            
            function updateTimer() {
                const now = new Date();
                let diff = now - startDate;
                if (diff < 0) diff = 0;
                
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById('daysCount').innerText = String(days).padStart(2, '0');
                document.getElementById('hoursCount').innerText = String(hours).padStart(2, '0');
                document.getElementById('minsCount').innerText = String(minutes).padStart(2, '0');
                document.getElementById('secsCount').innerText = String(seconds).padStart(2, '0');
            }
            setInterval(updateTimer, 1000);
            updateTimer();

            // قائمة الـ 15 رسالة رومانسية
            const messages = [
                "كل ثانية بتمر وأنا معاكي بحس كأن الدنيا لسه مبتدأة، وحبك جوه قلبي بيزيد ويكبر مفيش حدود.",
                "يا أجمل هدية ربنا رزقني بيها، ضحكتك دي هي النور اللي بينور لي كل طريق مظلم في حياتي.",
                "أنتِ مش بس حبيبتي، أنتِ سكني، وأماني، وكل الأماكن الحلوة اللي بتمني أفضل فيها للأبد.",
                "لو بيدي أجمع ستات العالم وأقولهم إنك الملكة بتاعتهم مكنتش تردد ولا لحظة، لأنك أروعهم وأطهرهم قلباً.",
                "عيونك دول هما الوطن اللي بتطمن فيه، وكل هم بيختفي أول ما بتيجي في بالي أو أسمع صوتك.",
                "بتمنالك السعادة اللي مفيهاش آخر، وبتمنى أفضل سبب لضحكتك وفرحتك لحد آخر عمرنا مع بعض.",
                "بحبك بكل جزيئات روحي، وبكل تفصيلة صغيرة فيكي بتخليني أقع في حبك من أول وجديد كل يوم.",
                "لما بكون معاكي بحس إن الزمن بيقف، وكل هموم الدنيا بتختفي وكأن مفيش غيرنا في الكون.",
                "وجودك جنبي هو أكبر نعمة شكرت ربنا عليها كل يوم، وأتعهد إني أفضل سند وضهر وأمان ليكي.",
                "الحياة معاكي طعمها تاني خالص، مليانة بالدفء والجمال والحب النقي اللي ملوش مثيل.",
                "مهما عبرت بالكلام، مفيش جملة ممكن توصف إنتي غالية عندي قد إيه، إنتي عمري كله.",
                "أنتِ الحكاية الحلوة اللي أتمنى أفضل أقراها وأعيش تفاصيلها طول عمري من غير ما تخلص.",
                "كل أحلامي البسيطة والكبيرة مرتبطة بيكي، وكل أمنياتي إننا نكبر سوا ونحقق كل اللي بنحلم بيه.",
                "أنتِ إشراقة الشموس في أيامي البرد، والنسيم الهادي اللي بيرد فيا الروح كل ما أتعب.",
                "أحبك اليوم وكل يوم، وإلى أبد الآبدين.. أنتِ حبي الوحيد ومفتاح قلبي للأبد ❤️💍"
            ];

            const cards = document.querySelectorAll('.love-card');
            const textElements = document.querySelectorAll('.card-text');
            const container = document.getElementById('messagesContainer');
            let currentMessageIndex = 0;

            function typeMessage() {
                if (currentMessageIndex < messages.length) {
                    const card = cards[currentMessageIndex];
                    const textEl = textElements[currentMessageIndex];
                    card.classList.add('active-card'); // إظهار الكارت
                    
                    let charIndex = 0;
                    const currentText = messages[currentMessageIndex];
                    
                    function typeChar() {
                        if (charIndex < currentText.length) {
                            textEl.textContent += currentText.charAt(charIndex);
                            charIndex++;
                            // سكرول تلقائي مستمر مع ظهور الحروف لأسفل الشاشة بسلاسة
                            container.scrollTop = container.scrollHeight;
                            setTimeout(typeChar, 35); // سرعة كتابة سريعة ومريحة
                        } else {
                            // انتهت الرسالة الحالية، الانتقال للرسالة التالية بعد فاصل زمني قصير
                            currentMessageIndex++;
                            setTimeout(typeMessage, 600);
                        }
                    }
                    typeChar();
                }
            }
            
            setTimeout(typeMessage, 800);
        }

        // رسومات الألعاب النارية في الخلفية
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        initCanvas();
        window.addEventListener('resize', initCanvas);

        const fireworks = [];
        const particles = [];

        class Firework {
            constructor(x, y, targetX, targetY) {
                this.x = x; this.y = y; this.targetX = targetX; this.targetY = targetY;
                this.coordinates = []; this.angle = Math.atan2(targetY - y, targetX - x);
                this.speed = 4; this.accel = 1.04;
                this.brightness = Math.random() * 20 + 60; this.hue = Math.random() * 20 + 340;
            }
            update(index) {
                this.coordinates.pop(); this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.accel;
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < this.speed) {
                    createParticles(this.targetX, this.targetY, this.hue);
                    fireworks.splice(index, 1);
                } else { this.x += vx; this.y += vy; }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.hue}, 90%, ${this.brightness}%)`;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x; this.y = y; this.coordinates = [];
                for (let i = 0; i < 4; i++) { this.coordinates.push([this.x, this.y]); }
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 8 + 1; this.friction = 0.95; this.gravity = 0.8;
                this.hue = hue; this.brightness = Math.random() * 20 + 60;
                this.alpha = 1; this.decay = Math.random() * 0.02 + 0.015;
            }
            update(index) {
                this.coordinates.pop(); this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
                if (this.alpha <= this.decay) { particles.splice(index, 1); }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 90%, ${this.brightness}%, ${this.alpha})`;
                ctx.stroke();
            }
        }

        function createParticles(x, y, hue) {
            let count = 30;
            while (count--) { particles.push(new Particle(x, y, hue)); }
        }

        let timer = 0;
        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(31, 20, 29, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            let i = fireworks.length;
            while (i--) { fireworks[i].update(i); fireworks.draw(); }
            let j = particles.length;
            while (j--) { particles.update(j); particles.draw(); }
            if (timer++ % 55 === 0) {
                let startX = canvas.width / 2; let startY = canvas.height;
                let targetX = Math.random() * canvas.width * 0.7 + canvas.width * 0.15;
                let targetY = Math.random() * canvas.height * 0.4;
                fireworks.push(new Firework(startX, startY, targetX, targetY));
            }
        }
        animate();
    </script>
</body>
</html>
