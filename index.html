<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>To My Beloved ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw; height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            background: radial-gradient(circle at center, #2e1d2a 0%, #1f141d 50%, #120b10 100%);
            font-family: 'Cairo', sans-serif;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            position: fixed; padding: 20px;
            transition: opacity 1.5s ease-in-out;
        }
        .fade-out { opacity: 0 !important; }

        /* الديكورات والألعاب النارية */
        .romantic-decorations {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; overflow: hidden;
        }
        .rom-item {
            position: absolute; font-size: 22px; opacity: 0.4;
            animation: floatRom 6s ease-in-out infinite alternate;
        }
        .rom-1 { top: 12%; left: 10%; }
        .rom-2 { top: 18%; right: 12%; animation-delay: 1.5s; font-size: 25px; }
        .rom-3 { bottom: 15%; left: 12%; animation-delay: 3s; font-size: 24px; }
        .rom-4 { bottom: 12%; right: 15%; animation-delay: 4.5s; }
        @keyframes floatRom {
            0% { transform: translateY(0px) scale(0.95); opacity: 0.25; }
            100% { transform: translateY(-12px) scale(1.05); opacity: 0.55; }
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .top-header-title {
            position: absolute; top: 20px; z-index: 10;
            font-family: 'Cinzel', serif; font-size: clamp(1.2rem, 3.5vw, 1.5rem);
            color: #ffb6c1; letter-spacing: 3px; font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
            opacity: 0; animation: fadeInHeader 1.5s ease forwards 0.5s;
        }
        @keyframes fadeInHeader { to { opacity: 1; } }

        /* عداد الحب الثابت في أعلى الصفحة بعد الدخول */
        .love-counter-bar {
            position: absolute; top: 15px; width: 92%; max-width: 500px;
            background: rgba(40, 25, 36, 0.85); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 182, 193, 0.3); border-radius: 15px;
            padding: 8px 10px; display: flex; justify-content: space-around; align-items: center;
            z-index: 20; box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            opacity: 0; transform: translateY(-20px); transition: all 1s ease;
            pointer-events: none;
        }
        .love-counter-bar.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .counter-box { text-align: center; }
        .counter-num { font-family: 'Cinzel', serif; font-size: 1.1rem; color: #ffd700; font-weight: 700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .counter-lbl { font-size: 0.7rem; color: #ffb6c1; letter-spacing: 1px; }

        /* المحتوى الرئيسي */
        .content-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 20px; width: 100%; max-width: 600px; margin: auto;
            z-index: 10; height: 100%;
        }

        .romantic-text {
            font-family: 'Playfair Display', serif; font-style: italic;
            font-size: clamp(1.3rem, 3.5vw, 2rem); color: #ffb6c1;
            line-height: 1.5; letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
            min-height: 120px; display: flex; align-items: center; justify-content: center;
            padding: 0 10px;
        }

        /* صندوق إدخال الباسورد */
        .password-container {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            width: 100%; max-width: 320px; opacity: 0; transform: translateY(20px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
        }
        .password-container.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .password-input {
            width: 100%; padding: 13px 20px; background: rgba(40, 25, 36, 0.9);
            border: 2px solid rgba(255, 182, 193, 0.4); border-radius: 50px;
            color: #fff1f2; font-size: 1.1rem; text-align: center; outline: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); transition: all 0.3s ease;
            font-family: 'Cinzel', serif; letter-spacing: 3px;
        }
        .password-input:focus { border-color: #ffb6c1; box-shadow: 0 0 20px rgba(255, 182, 193, 0.6); }

        .surprise-btn-wrapper {
            position: relative; padding: 2.5px; border-radius: 26px; overflow: hidden;
            width: 100%; cursor: pointer; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }
        .surprise-btn-wrapper:active { transform: scale(0.97); }
        .surprise-btn-wrapper::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 182, 193, 0.5), #ff758c, #ff7eb3, transparent 65%);
            animation: rotateGlow 4.5s linear infinite;
        }
        @keyframes rotateGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .surprise-btn-content {
            position: relative; background: rgba(40, 25, 36, 0.95); backdrop-filter: blur(20px);
            padding: 15px 20px; border-radius: 24px; z-index: 2; text-align: center;
        }
        .surprise-btn-content span {
            font-family: 'Cinzel', serif; font-size: clamp(0.95rem, 3.2vw, 1.1rem);
            color: #fff1f2; font-weight: 700; letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 182, 193, 0.5);
        }

        .error-msg { color: #ff6b81; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s ease; }
        .error-msg.show { opacity: 1; }

        /* حاوية رسائل الشات ذات الإطار الـ LED المتوهج والاسكرول التلقائي */
        .chat-container {
            display: none; flex-direction: column; gap: 15px; width: 100%; max-width: 480px;
            height: 65vh; overflow-y: auto; padding: 15px; margin-top: 50px;
            scroll-behavior: smooth; z-index: 15; opacity: 0; transition: opacity 1s ease;
        }
        .chat-container.show { display: flex; opacity: 1; }
        .chat-container::-webkit-scrollbar { width: 5px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255, 182, 193, 0.4); border-radius: 10px; }

        /* ليد رومانسي منفصل لكل رسالة */
        .led-message-wrapper {
            position: relative; padding: 2.5px; border-radius: 20px; overflow: hidden;
            width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: fadeInMsg 0.8s ease forwards; opacity: 0; transform: translateY(15px);
        }
        @keyframes fadeInMsg { to { opacity: 1; transform: translateY(0); } }
        .led-message-wrapper::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 182, 193, 0.4), #ff758c, #ff7eb3, transparent 65%);
            animation: rotateGlow 5s linear infinite;
        }
        .led-message-content {
            position: relative; background: rgba(35, 20, 31, 0.95); backdrop-filter: blur(15px);
            padding: 15px 20px; border-radius: 18px; z-index: 2; text-align: right;
            font-size: 0.95rem; color: #fff1f2; line-height: 1.6;
            font-family: 'Cairo', sans-serif;
        }
        .led-message-content span.highlight-m {
            color: #ffb6c1; font-weight: 700; font-family: 'Cinzel', serif;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.7);
        }

        .bottom-signature {
            font-family: 'Cinzel', serif; font-size: clamp(0.95rem, 3vw, 1.15rem);
            color: #ffd700; letter-spacing: 3px; font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); z-index: 10; padding-bottom: 10px;
            animation: pulseSignature 3s ease-in-out infinite alternate;
        }
        @keyframes pulseSignature { 0% { transform: scale(1); opacity: 0.85; } 100% { transform: scale(1.03); opacity: 1; } }

        .section {
            display: none; width: 100%; height: 100%; flex-direction: column;
            justify-content: space-between; align-items: center; position: absolute;
            top: 0; left: 0; padding: 20px; opacity: 0; transition: opacity 1s ease-in-out;
        }
        .section.active { display: flex; opacity: 1; }
    </style>
</head>
<body>

    <!-- تشغيل الموسيقى المستمرة -->
    <audio id="bgMusic" preload="auto" loop>
        <source src="https://serv100.albumaty.com/2025/Albumaty.Com_mnwaat_mwsyki_rwmansyt_mnwaat.mp3" type="audio/mpeg">
    </audio>

    <div class="romantic-decorations">
        <div class="rom-item rom-1">🌹</div>
        <div class="rom-item rom-2">💖</div>
        <div class="rom-item rom-3">✨</div>
        <div class="rom-item rom-4">🌸</div>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <!-- عداد الحب الثابت أعلى الصفحة بعد الباسورد -->
    <div class="love-counter-bar" id="loveCounterBar">
        <div class="counter-box"><div class="counter-num" id="daysCount">0</div><div class="counter-lbl">يوم</div></div>
        <div class="counter-box"><div class="counter-num" id="hoursCount">0</div><div class="counter-lbl">ساعة</div></div>
        <div class="counter-box"><div class="counter-num" id="minsCount">0</div><div class="counter-lbl">دقيقة</div></div>
        <div class="counter-box"><div class="counter-num" id="secsCount">0</div><div class="counter-lbl">ثانية</div></div>
    </div>

    <!-- القسم الأول (الصفحة الأولى) -->
    <div id="section1" class="section active">
        <div class="top-header-title">My Love 💓</div>
        <div></div>
        <div class="content-box">
            <div class="romantic-text" id="typedText1"></div>
        </div>
        <div class="bottom-signature">My Love My Heart My All ❤️❤️</div>
    </div>

    <!-- القسم الثاني (صفحة الباسورد ثم الشات والرسائل العشرة) -->
    <div id="section2" class="section">
        <div class="top-header-title" id="sec2Title" style="display:none;">Our Lovely Journey 💕</div>
        <div class="content-box" style="justify-content: flex-start;">
            <div class="romantic-text" id="typedText2" style="margin-top: 20px;"></div>

            <div class="password-container" id="passwordContainer">
                <input type="password" id="passInput" class="password-input" placeholder="Enter Password..." autocomplete="off">
                <div class="surprise-btn-wrapper" id="submitBtn">
                    <div class="surprise-btn-content">
                        <span>Let's get to the surprise! ✨</span>
                    </div>
                </div>
                <div id="errorText" class="error-msg">كلمة المرور غير صحيحة، جربي تاني يا قلبي ❤️</div>
            </div>

            <!-- حاوية الـ 10 رسائل برومانسية وحرف M مع اسكرول تلقائي -->
            <div class="chat-container" id="chatContainer">
                <!-- سيتم حقن الرسائل هنا برمجياً -->
            </div>
        </div>
        <div class="bottom-signature">My Love My Heart My All ❤️❤️</div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        music.volume = 0.5;
        function playAudio() { music.play().catch(() => {}); }

        window.addEventListener('DOMContentLoaded', () => {
            playAudio();
            document.body.addEventListener('click', playAudio, { once: true });
            startFirstScene();
        });

        function switchSection(fromId, toId, callback) {
            const current = document.getElementById(fromId);
            const next = document.getElementById(toId);
            current.classList.add('fade-out');
            setTimeout(() => {
                current.classList.remove('active', 'fade-out');
                next.classList.add('active');
                if (callback) callback();
            }, 1000);
        }

        const text1 = "To my beloved, the light of my eyes, the beat of my heart, and the soul of my heart...";
        let i1 = 0;
        function startFirstScene() {
            if (i1 < text1.length) {
                document.getElementById('typedText1').innerHTML += text1.charAt(i1);
                i1++;
                setTimeout(startFirstScene, 80);
            } else {
                setTimeout(() => {
                    switchSection('section1', 'section2', startSecondScene);
                }, 1500);
            }
        }

        const text2 = "I love you as it was in every story that brought us together";
        let i2 = 0;
        function startSecondScene() {
            function typeWriter2() {
                if (i2 < text2.length) {
                    document.getElementById('typedText2').innerHTML += text2.charAt(i2);
                    i2++;
                    setTimeout(typeWriter2, 70);
                } else {
                    setTimeout(() => {
                        document.getElementById('passwordContainer').classList.add('show');
                    }, 400);
                }
            }
            typeWriter2();
        }

        // دالة تحديث عداد الحب بدقة من 15 مارس 2024
        function updateLoveCounter() {
            const startDate = new Date('2024-03-15T00:00:00');
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('daysCount').innerText = days;
            document.getElementById('hoursCount').innerText = hours;
            document.getElementById('minsCount').innerText = mins;
            document.getElementById('secsCount').innerText = secs;
        }
        setInterval(updateLoveCounter, 1000);

        // قائمة الـ 10 رسائل الرومانسية وكل واحدة تحتوي على حرف M
        const romanticMessages = [
            "من اول يوم عرفتك فيه يا <span class='highlight-m'>M</span>، وعالمي بقى أجمل بكتير.",
            "كل نبضة في قلبي بتنطق اسمك يا أجمل <span class='highlight-m'>M</span> دخلت حياتي.",
            "وجودك جنبي هو السعادة الحقيقية والراحة اللي دايماً بتمناها يا <span class='highlight-m'>M</span>.",
            "ضحكتك بتنور لي كل ضلمة في طريقي، ربنا ما يحرمني من وجودك يا <span class='highlight-m'>M</span>.",
            "أنتِ الحكاية الحلوة اللي بدأت في 15 مارس 2024 ومش تنتهي أبداً يا <span class='highlight-m'>M</span>.",
            "مهما مر الوقت، حبي ليك بيزيد كل ثانية وكل دقيقة يا أغلى <span class='highlight-m'>M</span>.",
            "بحس بالامان والاطمئنان وأنا معاك، يا أحلى هدية ربنا رزقني بيها يا <span class='highlight-m'>M</span>.",
            "أنتِ مش بس حب حياتي، أنتِ روحي وعقلي وكل دنيتي يا <span class='highlight-m'>M</span>.",
            "كل أحلامي المستقبلية ببنيها وأنتِ معايا، يا أجمل شركاء العمر يا <span class='highlight-m'>M</span>.",
            "بحبك بعدد دقات قلبي وبكل حرف اتكتب عشانك يا أغلى اسم في قلبي يا <span class='highlight-m'>M</span> ❤️"
        ];

        // التحقق من كلمة المرور وعرض العداد والشات بالرسائل المتتالية والاسكرول التلقائي
        const passInput = document.getElementById('passInput');
        const submitBtn = document.getElementById('submitBtn');
        const errorText = document.getElementById('errorText');

        function checkPassword() {
            if (passInput.value === "1532024") {
                passInput.style.borderColor = "#2ecc71";
                passInput.style.boxShadow = "0 0 25px rgba(46, 204, 113, 0.7)";
                errorText.classList.remove('show');
                
                setTimeout(() => {
                    // إخفاء حقل الباسورد والنص القديم وإظهار العداد والشات
                    document.getElementById('typedText2').style.display = 'none';
                    document.getElementById('passwordContainer').style.display = 'none';
                    document.getElementById('sec2Title').style.display = 'block';
                    
                    const counterBar = document.getElementById('loveCounterBar');
                    counterBar.classList.add('show');
                    updateLoveCounter();

                    const chatContainer = document.getElementById('chatContainer');
                    chatContainer.classList.add('show');

                    // إدراج الرسائل تدريجياً مع الاسكرول التلقائي
                    let msgIndex = 0;
                    function loadNextMessage() {
                        if (msgIndex < romanticMessages.length) {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'led-message-wrapper';
                            wrapper.style.animationDelay = `${msgIndex * 0.1}s`;
                            
                            const content = document.createElement('div');
                            content.className = 'led-message-content';
                            content.innerHTML = `✨ ${romanticMessages[msgIndex]}`;
                            
                            wrapper.appendChild(content);
                            chatContainer.appendChild(wrapper);
                            
                            // اسكرول تلقائي لأسفل بسلاسة
                            chatContainer.scrollTo({
                                top: chatContainer.scrollHeight,
                                behavior: 'smooth'
                            });

                            msgIndex++;
                            setTimeout(loadNextMessage, 600); // ظهور رسالة كل 0.6 ثانية
                        }
                    }
                    loadNextMessage();

                }, 800);
            } else {
                errorText.classList.add('show');
                passInput.style.borderColor = "#ff6b81";
                passInput.style.boxShadow = "0 0 20px rgba(255, 107, 129, 0.6)";
                setTimeout(() => {
                    passInput.style.borderColor = "rgba(255, 182, 193, 0.4)";
                    passInput.style.boxShadow = "0 10px 25px rgba(0, 0, 0, 0.4)";
                }, 1000);
            }
        }

        submitBtn.addEventListener('click', checkPassword);
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        // رسومات الألعاب النارية في الخلفية
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        initCanvas();
        window.addEventListener('resize', initCanvas);

        const fireworks = [];
        const particles = [];

        class Firework {
            constructor(x, y, targetX, targetY) {
                this.x = x; this.y = y; this.targetX = targetX; this.targetY = targetY;
                this.coordinates = []; this.angle = Math.atan2(targetY - y, targetX - x);
                this.speed = 4; this.accel = 1.04;
                this.brightness = Math.random() * 20 + 60; this.hue = Math.random() * 20 + 340;
            }
            update(index) {
                this.coordinates.pop(); this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.accel;
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < this.speed) {
                    createParticles(this.targetX, this.targetY, this.hue);
                    fireworks.splice(index, 1);
                } else { this.x += vx; this.y += vy; }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.hue}, 90%, ${this.brightness}%)`;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x; this.y = y; this.coordinates = [];
                for (let i = 0; i < 4; i++) { this.coordinates.push([this.x, this.y]); }
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 8 + 1; this.friction = 0.95; this.gravity = 0.8;
                this.hue = hue; this.brightness = Math.random() * 20 + 60;
                this.alpha = 1; this.decay = Math.random() * 0.02 + 0.015;
            }
            update(index) {
                this.coordinates.pop(); this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
                if (this.alpha <= this.decay) { particles.splice(index, 1); }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 90%, ${this.brightness}%, ${this.alpha})`;
                ctx.stroke();
            }
        }

        function createParticles(x, y, hue) {
            let count = 30;
            while (count--) { particles.push(new Particle(x, y, hue)); }
        }

        let timer = 0;
        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(31, 20, 29, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            let i = fireworks.length;
            while (i--) { fireworks[i].update(i); fireworks.draw(); }
            let j = particles.length;
            while (j--) { particles.update(j); particles.draw(); }
            if (timer++ % 55 === 0) {
                let startX = canvas.width / 2; let startY = canvas.height;
                let targetX = Math.random() * canvas.width * 0.7 + canvas.width * 0.15;
                let targetY = Math.random() * canvas.height * 0.4;
                fireworks.push(new Firework(startX, startY, targetX, targetY));
            }
        }
        animate();
    </script>
</body>
</html>
