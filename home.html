<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>To My Beloved ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw; height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            background: radial-gradient(circle at center, #2e1d2a 0%, #1f141d 50%, #120b10 100%);
            font-family: 'Cairo', sans-serif;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            position: fixed; padding: 25px 20px;
            animation: fadeInPage 1.5s ease-in-out;
            transition: opacity 1.5s ease-in-out;
        }
        @keyframes fadeInPage {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .fade-out { opacity: 0 !important; }

        /* المحتوى الرئيسي في المنتصف */
        .content-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 25px; width: 100%; max-width: 600px; margin: auto;
            z-index: 10;
        }

        /* النص الرومانسي الذي يُكتب حرف بحرف */
        .romantic-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1.4rem, 3.8vw, 2.2rem);
            color: #ffb6c1;
            line-height: 1.6;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        /* صندوق إدخال الباسورد */
        .password-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .password-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        .password-input {
            width: 100%;
            padding: 13px 20px;
            background: rgba(40, 25, 36, 0.9);
            border: 2px solid rgba(255, 182, 193, 0.4);
            border-radius: 50px;
            color: #fff1f2;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
        }

        .password-input:focus {
            border-color: #ffb6c1;
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
        }

        /* زر المفاجأة بنفس ستايل الصفحة الأولى المتوهج */
        .surprise-btn-wrapper {
            position: relative;
            padding: 2.5px;
            border-radius: 26px;
            overflow: hidden;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }

        .surprise-btn-wrapper:active {
            transform: scale(0.97);
        }

        .surprise-btn-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 182, 193, 0.5), #ff758c, #ff7eb3, transparent 65%);
            animation: rotateGlow 4.5s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .surprise-btn-content {
            position: relative;
            background: rgba(40, 25, 36, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            border-radius: 24px;
            z-index: 2;
            text-align: center;
        }

        .surprise-btn-content span {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.95rem, 3.2vw, 1.1rem);
            color: #fff1f2;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 182, 193, 0.5);
        }

        .error-msg {
            color: #ff6b81;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-msg.show {
            opacity: 1;
        }

        /* الشكل السفلي الفخم بلون مختلف */
        .bottom-signature {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            color: #ffd700;
            letter-spacing: 3px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            z-index: 10;
            padding-bottom: 10px;
            animation: pulseSignature 3s ease-in-out infinite alternate;
        }

        @keyframes pulseSignature {
            0% { transform: scale(1); opacity: 0.85; }
            100% { transform: scale(1.03); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- استمرار الموسيقى بسلاسة من الصفحة الأولى -->
    <audio id="bgMusic" preload="auto" loop>
        <source src="https://serv100.albumaty.com/2025/Albumaty.Com_mnwaat_mwsyki_rwmansyt_mnwaat.mp3" type="audio/mpeg">
    </audio>

    <div></div> <!-- مساحة للتوازن -->

    <!-- المحتوى والرسالة -->
    <div class="content-box">
        <div class="romantic-text" id="typedText"></div>

        <div class="password-container" id="passwordContainer">
            <input type="password" id="passInput" class="password-input" placeholder="Enter Password..." autocomplete="off">
            
            <div class="surprise-btn-wrapper" id="submitBtn">
                <div class="surprise-btn-content">
                    <span>Let's get to the surprise! ✨</span>
                </div>
            </div>

            <div id="errorText" class="error-msg">كلمة المرور غير صحيحة، جربي تاني يا قلبي ❤️</div>
        </div>
    </div>

    <!-- الشكل السفلي المميز -->
    <div class="bottom-signature">
        My Love My Heart My All ❤️❤️
    </div>

    <script>
        // تشغيل الموسيقى
        const music = document.getElementById('bgMusic');
        music.volume = 0.5;
        
        window.addEventListener('DOMContentLoaded', () => {
            music.play().catch(() => {
                document.body.addEventListener('click', () => {
                    music.play();
                }, { once: true });
            });
        });

        // تأثير الكتابة حرف بحرف للجملة الإنجليزية المطلوبة
        const textString = "I love you as it was in every story that brought us together";
        let index = 0;

        function typeWriter() {
            if (index < textString.length) {
                document.getElementById('typedText').innerHTML += textString.charAt(index);
                index++;
                setTimeout(typeWriter, 70); // سرعة كتابة مريحة جداً
            } else {
                // لما تخلص كتابة، يظهر صندوق الباسورد والزرار بسلاسة
                setTimeout(() => {
                    document.getElementById('passwordContainer').classList.add('show');
                }, 500);
            }
        }

        window.onload = () => {
            setTimeout(typeWriter, 600);
        };

        // التحقق من الباسورد عند الضغط على الزر
        const passInput = document.getElementById('passInput');
        const submitBtn = document.getElementById('submitBtn');
        const errorText = document.getElementById('errorText');

        submitBtn.addEventListener('click', () => {
            if (passInput.value === "1532024") {
                passInput.style.borderColor = "#2ecc71";
                passInput.style.boxShadow = "0 0 25px rgba(46, 204, 113, 0.7)";
                errorText.classList.remove('show');
                
                // تأثير خروج وانتقال سلس للصفحة التالتة
                setTimeout(() => {
                    document.body.classList.add('fade-out');
                    setTimeout(() => {
                        window.location.href = "page3.html"; 
                    }, 1500);
                }, 400);
            } else {
                errorText.classList.add('show');
                passInput.style.borderColor = "#ff6b81";
                passInput.style.boxShadow = "0 0 20px rgba(255, 107, 129, 0.6)";
                setTimeout(() => {
                    passInput.style.borderColor = "rgba(255, 182, 193, 0.4)";
                    passInput.style.boxShadow = "0 10px 25px rgba(0, 0, 0, 0.4)";
                }, 1000);
            }
        });

        // دعم الضغط على زر Enter من لوحة المفاتيح
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });
    </script>
</body>
</html>
